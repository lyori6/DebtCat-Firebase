    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Dispute Letter Submission</title>
      <style>
        /* Custom Spinner Styling */
        .spinner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(farthest-side,#3358ef 94%,#0000) top/9px 9px no-repeat,
                       conic-gradient(#0000 30%,#3358ef);
            -webkit-mask: radial-gradient(farthest-side,#0000 calc(100% - 9px),#000 0);
            animation: spinner-c7wet2 1s infinite linear;
            display: block; 
        }
        @keyframes spinner-c7wet2 {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        /* Fullscreen overlay to center the spinner */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0); /* Transparent background */
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
    </style>
    </head>
    <body>
      <!--  Overlay with Spinner  -->
      <div class="overlay" id="loadingOverlay">
        <div class="spinner"></div>
      </div>
      <script>
    var POLL_MS = 3000;
    var MAX_MS = 60000;
    function showMessage(message, isError) {
        var box = document.getElementById('messageBox');
        if (!box) {
            box = document.createElement('div');
            box.id = 'messageBox';
            box.style.cssText = 'max-width:480px;margin:120px auto 40px;padding:16px;border:1px solid;border-radius:8px;text-align:center;font-size:18px;';
            document.body.appendChild(box);
        }
        box.style.backgroundColor = isError ? '#f8d7da' : '#d4edda';
        box.style.color = isError ? '#721c24' : '#155724';
        box.style.borderColor = isError ? '#f5c6cb' : '#c3e6cb';
        box.textContent = message;
    }
    function fail() {
        window.location.href = '/s/letter-failed';
    }
    function done() {
        try { sessionStorage.removeItem('submittedData'); } catch (e) {}
        window.location.href = '/ty-mail.html';
    }
    window.addEventListener('load', function () {
        var id = new URLSearchParams(window.location.search).get('order');
        if (!id || !/^[0-9a-fA-F-]{36}$/.test(id)) { fail(); return; }
        var started = Date.now();
        function poll() {
            fetch(window.DC_API + '/api/letters/order?id=' + encodeURIComponent(id))
                .then(function (r) { return r.ok ? r.json() : { status: 'error' }; })
                .catch(function () { return { status: 'error' }; })
                .then(function (data) {
                    if (data.status === 'mailed') { done(); return; }
                    if (data.status === 'missing') { fail(); return; }
                    if (data.status === 'pending' || data.status === 'mailing') {
                        showMessage("Payment received. We're mailing your letter now.", false);
                    }
                    if (Date.now() - started >= MAX_MS) {
                        showMessage("Your payment went through and your letter is on its way to the mail service. We'll email you when it's sent. You can close this page.", false);
                        return;
                    }
                    setTimeout(poll, POLL_MS);
                });
        }
        poll();
    });
</script>
